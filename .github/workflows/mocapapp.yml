# mocapapp (app/): tests on Windows and macOS; on a mocapapp-v* tag, builds the installers into a draft release.
# The Windows installer waits only for the Windows jobs; the macOS zip is added to the draft once macOS passes.
name: mocapapp

on:
  push:
    branches: [ "app/**" ]
    paths: [ "app/**", "Pose2Sim/**", ".github/workflows/mocapapp.yml" ]
    tags: [ "mocapapp-v*" ]
  pull_request:
    paths: [ "app/**" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.13.4"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - name: Tests (failures are also written as an annotation, which can be read without signing in)
        shell: bash
        run: |
          set -o pipefail
          if ! uv run pytest -q -m "not slow" -rf 2>&1 | tee "$RUNNER_TEMP/pytest.log"; then
            text=$( { sed -n '/^=* FAILURES =*$/,$p' "$RUNNER_TEMP/pytest.log" | tail -150; } || true)
            [ -n "$text" ] || text=$(tail -60 "$RUNNER_TEMP/pytest.log")
            text=$(printf '%s\n' "$text" | tr -d '\r' | awk '{gsub(/%/, "%25"); printf "%s%%0A", $0}')
            echo "::error title=pytest failed::$text"
            exit 1
          fi

  test-macos:
    # same steps as test; a separate job so a macOS problem never holds back the Windows installer
    runs-on: macos-15   # OpenSim's macOS wheels need macOS 15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.13.4"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - name: Tests (failures are also written as an annotation, which can be read without signing in)
        shell: bash
        run: |
          set -o pipefail
          if ! uv run pytest -q -m "not slow" -rf 2>&1 | tee "$RUNNER_TEMP/pytest.log"; then
            text=$( { sed -n '/^=* FAILURES =*$/,$p' "$RUNNER_TEMP/pytest.log" | tail -150; } || true)
            [ -n "$text" ] || text=$(tail -60 "$RUNNER_TEMP/pytest.log")
            text=$(printf '%s\n' "$text" | tr -d '\r' | awk '{gsub(/%/, "%25"); printf "%s%%0A", $0}')
            echo "::error title=pytest failed::$text"
            exit 1
          fi

  macos-zip:
    if: startsWith(github.ref, 'refs/tags/mocapapp-v')
    needs: test-macos
    runs-on: ubuntu-latest   # only zips files; macOS runners are often short of capacity
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Zip the macOS installer (zip keeps the executable bit the .command files need)
        run: |
          chmod +x app/installer/macos/*.command
          mkdir -p app/dist
          zip -j app/dist/mocapapp-macos.zip app/installer/macos/*.command app/installer/windows/license.txt
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: mocapapp-macos
          path: app/dist/mocapapp-macos.zip

  setup-test:
    # installs a test build of mocapapp-setup.exe silently, checks it and uninstalls it (branch pushes and tags)
    if: github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Test the setup end to end (silent install, check, uninstall)
        shell: pwsh
        run: |
          # Failures are also written as annotations: they can be read without signing in, logs cannot.
          function Fail([string]$title, $lines) {
            $text = (($lines | ForEach-Object { "$_" }) -join "`n") -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A'
            Write-Output "::error title=$title::$text"
            exit 1
          }
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\iscc.exe")) { choco install innosetup -y --no-progress }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\iscc.exe"
          # the same script as the release, but install.ps1 does not wait for Enter at the end
          $out = & $iscc "/DRef=${{ github.ref_name }}" "/DAppVersion=0.0.0" "/DPauseArg=" app\installer\windows\mocapapp.iss 2>&1
          $out | Select-Object -Last 15
          if ($LASTEXITCODE) { Fail "iscc failed" ($out | Select-Object -Last 25) }
          $log = Join-Path $env:RUNNER_TEMP "setup.log"
          $proc = Start-Process app\dist\mocapapp-setup.exe -Wait -PassThru -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=`"$log`""
          $prefix = Join-Path $env:LOCALAPPDATA "mocapapp"
          $inst = @(Get-Content "$prefix\install.log" -Tail 40 -ErrorAction SilentlyContinue)
          $inst
          $exe = "$prefix\venv\Scripts\mocapapp.exe"
          if (-not (Test-Path $exe)) {
            Fail "setup did not install the app (exit $($proc.ExitCode))" (@("--- setup.log") + @(Get-Content $log -Tail 25 -ErrorAction SilentlyContinue) + @("--- install.log") + $inst)
          }
          $doc = & $exe doctor --dir $env:USERPROFILE 2>&1
          $doc
          if ($LASTEXITCODE) { Fail "the installed app fails its checks" $doc }
          # the uninstaller relaunches itself from a temp copy, so wait for its result
          Start-Process "$prefix\setup\unins000.exe" -Wait -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES"
          for ($i = 0; ($i -lt 60) -and (Test-Path "$prefix\venv"); $i++) { Start-Sleep 2 }
          if (Test-Path "$prefix\venv") { Fail "the uninstaller left the installation behind" @(Get-ChildItem -Name $prefix) }

  installers:
    if: startsWith(github.ref, 'refs/tags/mocapapp-v')
    needs: [ test, setup-test ]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Build mocapapp-setup.exe with Inno Setup 6
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\iscc.exe")) { choco install innosetup -y --no-progress }
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^mocapapp-v', ''
          & "${env:ProgramFiles(x86)}\Inno Setup 6\iscc.exe" "/DRef=$tag" "/DAppVersion=$version" app\installer\windows\mocapapp.iss
      - name: Draft a pre-release with the Windows installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" app/dist/mocapapp-setup.exe `
            --draft --prerelease --title "mocapapp ${{ github.ref_name }}" `
            --notes "Release candidate. Research use only. See app/src/mocapapp/resources/user-guide.md."

  macos-release:
    if: startsWith(github.ref, 'refs/tags/mocapapp-v')
    needs: [ installers, macos-zip ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4.3.0
        with:
          name: mocapapp-macos
          path: dist
      - name: Add the macOS installer to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" dist/mocapapp-macos.zip --repo "${{ github.repository }}"
