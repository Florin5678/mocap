[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mocapapp"
version = "0.1.0rc8"
description = "Desktop app around Pose2Sim: multi-camera video to validated 3D pose and OpenSim kinematics, for research use only."
requires-python = ">=3.11,<3.14"
license = "BSD-3-Clause"
dependencies = [
    "pose2sim",
    "pydantic>=2.9,<3",
    "rtoml>=0.11",
    "tomlkit>=0.13",
    "imageio-ffmpeg>=0.5",
    "reportlab>=4.2,<5",
]

[project.scripts]
mocapapp = "mocapapp.cli.main:main"

[project.gui-scripts]
mocapapp-gui = "mocapapp.gui.app:main"

[dependency-groups]
dev = [
    "pypdf>=5",
    "pytest>=8.3",
    "pytest-qt>=4.4",
    "ruff>=0.7",
]

[tool.uv.sources]
pose2sim = { path = "..", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/mocapapp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs Pose2Sim on demo data (minutes)"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
